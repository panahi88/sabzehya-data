name: update
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"
    - cron: "20 4 * * *"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 jdatetime
      - run: python scrape.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add *.csv
          if ! git diff --cached --quiet; then
            git commit -m "update"
            git push
          fi
