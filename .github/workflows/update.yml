name: update
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: update-prices
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 jdatetime
      - run: python scrape.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          git add *.csv
          if ! git diff --cached --quiet; then
            git commit -m "update"
            git push
          fi
